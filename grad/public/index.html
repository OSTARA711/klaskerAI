<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Ostara</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">

  <link rel="stylesheet" href="/css/style.css">

  <script>
    try {
      const ws = new WebSocket("ws://localhost:1314");
      ws.onmessage = () => location.reload();
    } catch {}
  </script>

</head>
<body>

<header class="site-header">
  <div class="container">

    <div class="logo">
      <a href="/">
      <img src="/img/ostara.svg" alt="OSTARA.WORK Logo" class="logo-img">
      </a>
    </div>

    <nav class="main-nav">
      <a href="/">Ostara</a>
      <a href="/resources/">Resources</a>
      <a href="/history/">History</a>
    </nav>

    <div class="search">
      <input id="search" placeholder="Search..." />
    </div>

  </div>
</header>

<main class="container">
  <h1>Ostara</h1>
<h2>Technology Stack</h2>
<div class="service-grid">

<a class="service-card" href="/services/caldav/">
<h3>CalDAV</h3>
<p>Calendar and contacts</p>
</a>

<a class="service-card" href="/services/zulip/">
<h3>Zulip</h3>
<p>Team communication</p>
</a>

<a class="service-card" href="/services/vaultwarden/">
<h3>Vaultwarden</h3>
<p>Password manager</p>
</a>

<a class="service-card" href="/services/wireguard/">
<h3>WireGuard</h3>
<p>Secure VPN access</p>
</a>

</div>
</main>

<footer class="site-footer">
  <div class="container">

    <p class="footer-tagline">
      Welcome to Grad static powered Website
    </p>

    <nav class="footer-nav">
      <a href="/privacy/">Privacy</a>
      <a href="/cookies/">Cookies</a>
      <a href="/terms/">Terms & Conditions</a>
    </nav>

  </div>
</footer>

<script>
fetch("/index.json")
  .then(r => r.json())
  .then(data => {

    const input = document.getElementById("search");

    let results = document.getElementById("results");
    if (!results) {
      results = document.createElement("ul");
      results.id = "results";
      input.parentNode.appendChild(results);
    }

    let timer;

    input.addEventListener("input", () => {

      clearTimeout(timer);

      timer = setTimeout(() => {

        const q = input.value.toLowerCase();

        if (!q) {
          results.innerHTML = "";
          return;
        }

        results.innerHTML = data.pages
          .filter(p => p.title.toLowerCase().includes(q))
          .map(p => `<li><a href="${p.url}">${p.title}</a></li>`)
          .join("");

      }, 120);

    });

  });
</script>

</body>
</html>
